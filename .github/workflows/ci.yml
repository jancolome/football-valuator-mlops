name: CI Pipeline Football Valuator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Análisis estático con flake8
        run: flake8 tests/ --max-line-length=120 --extend-ignore=E501,W293,W292,E303

      - name: Ejecutar tests con pytest
        run: pytest tests/ -v
